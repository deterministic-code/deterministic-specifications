version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/backend/routes.spec.yaml
title: routes.yaml
description: >
  Strict schema for deterministic/routes.yaml. Declares the REST route
  surface (method, path, request/response types, aliases) plus the
  combined_routes composition metadata. Expansion into the flattened
  routes-api IR (see routes-api.spec.yaml) feeds OpenAPI, GraphQL, proto,
  and the Express route loader.

type: object
additionalProperties: false
required: [version]

properties:
  version:
    description: >
      Contract version this document targets. Must be a semver
      (e.g. 1.0.0). The document is validated against that version's
      specs and engine; there is no floating alias.
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  includes:
    type: array
    minItems: 1
    description: >
      Optional. Composes this routes config. A `types:` directive entry
      auto-generates CRUD routes for the types.yaml candidates its `filter`
      selects. Eager child projections live on type-named entries under
      `routes:` (`eager_read_path`, `eager_update_path`,
      `eager_read_member_only`), not on the include. `file:`/`id:` entries
      pull in other routes configs and merge their `routes:` arrays via the
      combine module (each included config's routes prepended, this config's
      own routes last). An `id:` entry also folds the referenced
      deterministic's datasource. The `file:`/`id:` entries are resolved and
      stripped before emit; the `types:` directive is consumed at
      route-expansion time.
    items:
      $ref: "#/$defs/includeEntry"

  combined_routes:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/combinedRouteEntry"

  routes:
    type: array
    minItems: 0
    items:
      $ref: "#/$defs/routeEntry"

$defs:
  includeEntry:
    oneOf:
      - $ref: "#/$defs/typesDirectiveInclude"
      - $ref: "#/$defs/fileInclude"
      - $ref: "#/$defs/idInclude"
      - $ref: "#/$defs/uuidInclude"
      - $ref: "#/$defs/userNameInclude"

  typesDirectiveInclude:
    type: object
    additionalProperties: false
    required: [types]
    properties:
      types:
        type: object
        additionalProperties: false
        properties:
          filter:
            $ref: "#/$defs/filterExpr"

  fileInclude:
    type: object
    additionalProperties: false
    required: [file]
    properties:
      file:
        type: string
        minLength: 1
        description: Path to another routes.yaml, relative to this file's dir.
      combine_options:
        $ref: "#/$defs/combineOptions"

  idInclude:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        description: Deterministic id (number) or name (string) of a saved backend.
        anyOf:
          - type: string
            minLength: 1
          - type: integer
            minimum: 1
      combine_options:
        $ref: "#/$defs/combineOptions"

  uuidInclude:
    type: object
    additionalProperties: false
    required: [uuid]
    properties:
      uuid:
        type: string
        minLength: 1
        description: Stable uuid of a saved deterministic; portable across server instances.
      combine_options:
        $ref: "#/$defs/combineOptions"

  userNameInclude:
    type: object
    additionalProperties: false
    required: [user_id, name]
    properties:
      user_id:
        type: integer
        minimum: 1
        description: Owner user id; pair with `name` to reference a saved deterministic.
      name:
        type: string
        minLength: 1
        description: Deterministic name (unique per user); pair with `user_id`.
      combine_options:
        $ref: "#/$defs/combineOptions"

  combineOptions:
    type: object
    additionalProperties: false
    description: >
      Per-side transforms applied before merging. `source` transforms the
      included routes config; `destination` transforms this config. Routes are
      flat entries (string shorthand or a single-key object), so the only
      supported op is dropping a whole route by name.
    properties:
      source:
        $ref: "#/$defs/sideOptions"
      destination:
        $ref: "#/$defs/sideOptions"

  sideOptions:
    type: object
    additionalProperties: false
    properties:
      remove_routes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/routeName"

  routeName:
    type: string
    minLength: 1
    pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    description: >
      Route name to drop from the side before merge — the string-shorthand entry
      itself, or the single key of an object-form route entry.

  filterExpr:
    type: string
    minLength: 1
    description: >
      Inclusion predicate. The candidate is KEPT when TRUE. types,
      datasource, routes, and services share this grammar:

        expr     ::= or
        or       ::= and ( "||" and )*
        and      ::= atom ( "&&" atom )*
        atom     ::= "(" expr ")" | compare
        compare  ::= accessor ("==" | "!=") value
        accessor ::= "type" | "tag" | "inherits"
        value    ::= quoted-string

      `type` is the candidate name (`type == "person"`). `tag` is true when
      the candidate's `tags` array contains that string
      (`tag == "view_type"`). `inherits` is the parent type name
      (`inherits == "set"`). String literals must be double-quoted. Any
      other identifier is a parse error.

  eagerReadPath:
    description: |
      Auto-attach array+reference children declared in types.yaml, selected
      by a path relative to this route's type key. Each entry walks through
      one or more nested array+reference fields:

        - "tasks"            attach user.tasks (depth 1, under routes.user)
        - "posts.tags"       attach user.posts and post.tags (depth 2)
        - "tags"             attach user.tags (M2M via a junction field)

      Each segment must match `^[a-z_][a-z0-9_]*$`. The first segment is an
      array+reference field on this type; every later segment is a field on
      the previous segment's element type.

      Catalog vs. projection: types.yaml declares the *available* relations
      on a type. routes.yaml selects which of those relations are
      *projected* into the parent response via eager_read_path. Relations
      declared on the type but not selected here are reachable only via
      their combined_routes sub-route — they are NOT inlined and NOT
      emitted as empty arrays in the parent response. Emitting [] would
      mislead clients into reading length=0 as "no children" when it really
      means "not fetched."
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
      pattern: "^[a-z_][a-z0-9_]*(\\.[a-z_][a-z0-9_]*)*$"

  eagerReadMemberOnly:
    description: |
      A subset of `eager_read_path`. Relations listed here are attached only
      on member responses — `GET /:id` and the POST/PUT/PATCH result bodies
      — and are NOT embedded in the collection list (`GET /`). Use it for
      heavy or unbounded-text children (e.g. a file's `contents`) that would
      bloat a list of N parents into an N×(child sizes) payload while the
      list UI only needs parent metadata.

      Every entry MUST also appear in `eager_read_path` (this key narrows
      where an already-declared eager relation is projected; it does not
      declare a new one). Depth-1 only — the collection-vs-member
      distinction is meaningful only at the top-level entity whose list
      route this governs.

        - "files"   embed files on GET /api/projects/:id, omit on the list
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
      pattern: "^[a-z_][a-z0-9_]*$"

  eagerUpdatePath:
    description: |
      Declare which array+reference children accept write reconciliation
      on POST/PUT/PATCH, selected by a path relative to this route's type
      key. Each entry names a direct-FK array field:

        - "addresses"     allow nested address writes on contact endpoints
        - "phones"        allow nested phone writes on contact endpoints
        - "tasks"         allow nested task writes on todo endpoints

      v1: depth-1 only; direct-FK only (M2M not supported in v1).

      Each segment must match `^[a-z_][a-z0-9_]*$`. The field's type must
      be an array of a type with a `references:` back to this type
      (direct-FK; M2M via junction tables is not supported in v1).
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      minLength: 1
      pattern: "^[a-z_][a-z0-9_]*$"

  entityOverlayShape:
    type: object
    additionalProperties: false
    minProperties: 1
    description: >
      Type-named overlay on auto-generated CRUD. No `path` or HTTP `method`.
      Eager paths are relative to this entry's key.
    properties:
      eager_read_path:
        $ref: "#/$defs/eagerReadPath"
      eager_update_path:
        $ref: "#/$defs/eagerUpdatePath"
      eager_read_member_only:
        $ref: "#/$defs/eagerReadMemberOnly"

  routeArgSpec:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, name]
        properties:
          kind: { const: repo }
          name: { type: string, minLength: 1 }
      - type: object
        additionalProperties: false
        required: [kind, name]
        properties:
          kind: { const: service }
          name: { type: string, minLength: 1 }
      - type: object
        additionalProperties: false
        required: [kind, key]
        properties:
          kind: { const: config }
          key: { type: string, minLength: 1 }
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: { const: undefined }
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: { const: literal }
          value: {}

  combinedRouteEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [route, combines]
      properties:
        route:
          type: string
          pattern: "^/"
        combines:
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/combinedTypeItem"

  combinedTypeItem:
    oneOf:
      - type: string
        minLength: 1
        pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
      - type: object
        minProperties: 1
        maxProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            via: { type: string, minLength: 1, pattern: "^[a-z_][a-z0-9_]*$" }
            target:
              { type: string, minLength: 1, pattern: "^[a-z_][a-z0-9_]*$" }
            route: { type: string, pattern: "^/" }
          required: [route]

  routeEntry:
    oneOf:
      - type: string
        minLength: 1
        pattern: "^[a-z_][a-zA-Z0-9_]*$"
        description: >
          Shorthand byField route entry. Grammar:
          `(get|put|delete)?_<pluralEntity>_by_<camelField>`. The optional
          verb prefix maps to methods=[GET], [PUT], or [DELETE]; without it
          the route emits all three. The pluralEntity's last token is
          singularized to match an entry in types.yaml, and the
          camelField is converted to snake_case to match a column on that
          entity.
      - type: object
        minProperties: 1
        maxProperties: 1
        additionalProperties:
          oneOf:
            - type: "null"
              description: >
                Empty-map shorthand. The map key follows the same grammar as
                the string shorthand above.
            - $ref: "#/$defs/entityOverlayShape"
            - $ref: "#/$defs/customRouteShape"
            - $ref: "#/$defs/byFieldRouteShape"

  byFieldRouteShape:
    type: object
    additionalProperties: false
    required: [entity, byField]
    properties:
      entity:
        type: string
        pattern: "^[a-z_][a-z0-9_]*$"
        description: >
          Type whose underlying table is the lookup target.
          The route layer generates /api/<plural>/<byField>/{value} endpoints.
      byField:
        type: string
        pattern: "^[a-z_][a-z0-9_]*$"
        description: >
          Column on the entity used as the path parameter. If the column is
          the type's identity (`is_id` / `ids` / injected `id` on a set),
          declared `is_unique: true` on datasource.yaml, or covered by a
          single-column unique index, the generated handlers treat the route
          as a single-resource lookup (200 / 404 / 409); otherwise they
          return an array on GET and a count on PUT/DELETE.
      methods:
        type: array
        uniqueItems: true
        minItems: 1
        items:
          type: string
          enum: [GET, PUT, DELETE]
        description: >
          Subset of [GET, PUT, DELETE] to emit. Default is all three.
      description:
        type: string
        minLength: 1

  customRouteShape:
    type: object
    additionalProperties: false
    required: [path, method]
    properties:
      path:
        type: string
        pattern: "^/"
        minLength: 1
      method:
        type: string
        enum: [GET, POST, PUT, PATCH, DELETE]
      description:
        type: string
        minLength: 1
      request:
        type: string
        minLength: 1
        pattern: "^[a-z_][a-z0-9_]*$"
        description: Name of a type defined in types.yaml.
      response:
        description: >
          Either the literal `redirect` (HTTP 302 with no body schema) or the
          name of a type defined in types.yaml. `redirect` is not a type
          name.
        oneOf:
          - const: redirect
          - type: string
            minLength: 1
            pattern: "^(?!redirect$)[a-z_][a-z0-9_]*$"
      service:
        type: string
        minLength: 1
        pattern: "^[A-Z][A-Za-z0-9]*$"
        description: >
          Service name declared in services.yaml. Mutually exclusive with
          `services` and with `routeClass`/`module`.
      services:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: "^[A-Z][A-Za-z0-9]*$"
        description: >
          Ordered array of service class names declared in services.yaml.
          Mutually exclusive with `service` and with `routeClass`/`module`.
      function:
        type: string
        minLength: 1
        pattern: "^[a-z][A-Za-z0-9_]*$"
        description: Service function to dispatch (renamed from serviceMethod).
      aliases:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^/"
      authentication:
        type: string
        enum: [none, signinSession, request]
        description: >
          Per-route authentication discriminator consumed by
          deterministic-create-backend-app. Default (when omitted) is `none`.
      scopes:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      errors:
        type: array
        items:
          type: integer
          minimum: 100
          maximum: 599
      routeClass:
        type: string
        minLength: 1
        pattern: "^[A-Z][A-Za-z0-9]*$"
        description: >
          Route class name (PascalCase). When set together with `module:`, the
          framework dynamic-imports the module and instantiates the class to
          mount this route. Without this pair the route falls back to the
          service+function dispatch.
      module:
        type: string
        minLength: 1
        description: >
          Dynamic-import specifier the runtime hands to `import()` to resolve
          the route class at app bootstrap. Bare specifier or relative path.
          Requires `routeClass:` to name the exported class.
      args:
        type: array
        description: >
          Optional constructor args resolved by the DI container, in positional
          order. Same shape as `services[].args` — each item is one of `repo`,
          `service`, `config`, `undefined`, or `literal`.
        items:
          $ref: "#/$defs/routeArgSpec"
      x-implementation:
        type: string
        enum: [stub]
        description: >
          Marks a route whose handler is a 501-returning stub (no hand-written
          impl in custom/<lang>/). openapi-spec-build propagates this onto the
          emitted op so stripStubOperations excludes the route from generated
          OpenAPI e2e test cases.
