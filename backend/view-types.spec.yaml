version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/backend/view-types.spec.yaml
title: view_types.yaml
description: >
  Strict schema for deterministic/view_types.yaml. View types compose
  datasource tables (via `inherits`) and other view types (via `type:` refs
  and `one_of`) into the shapes actually returned by API endpoints.

type: object
additionalProperties: false
required: [version]

properties:
  version:
    description: >
      Contract version this document targets. Must be a semver
      (e.g. 1.0.0). The document is validated against that version's
      specs and engine; there is no floating alias.
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  includes:
    type: array
    minItems: 1
    description: >
      Optional. Composes this view_types config. The single `datasource_types`
      directive entry auto-emits pass-through views for the datasource model
      (was the top-level `datasource_types:` block). `file:`/`id:` entries pull
      in other view_types configs and merge them via the combine module (each
      included config's types prepended, this config's own types last). The
      `file:`/`id:` entries are resolved and stripped before emit; the
      `datasource_types` directive is consumed at view-expansion time.
    items:
      $ref: "#/$defs/includeEntry"

  types:
    type: array
    items:
      $ref: "#/$defs/viewEntry"

$defs:
  includeEntry:
    oneOf:
      - $ref: "#/$defs/datasourceDirectiveInclude"
      - $ref: "#/$defs/fileInclude"
      - $ref: "#/$defs/idInclude"
      - $ref: "#/$defs/uuidInclude"
      - $ref: "#/$defs/userNameInclude"

  datasourceDirectiveInclude:
    type: object
    additionalProperties: false
    required: [datasource_types]
    properties:
      datasource_types:
        type: object
        additionalProperties: false
        properties:
          include: { type: string, minLength: 1 }
          filter: { type: string, minLength: 1 }
          auto_enrich: { type: boolean }

  fileInclude:
    type: object
    additionalProperties: false
    required: [file]
    properties:
      file:
        type: string
        minLength: 1
        description: Path to another view_types.yaml, relative to this file's dir.
      combine_options:
        $ref: "#/$defs/combineOptions"

  idInclude:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        description: Deterministic id (number) or name (string) of a saved backend.
        anyOf:
          - type: string
            minLength: 1
          - type: integer
            minimum: 1
      combine_options:
        $ref: "#/$defs/combineOptions"

  uuidInclude:
    type: object
    additionalProperties: false
    required: [uuid]
    properties:
      uuid:
        type: string
        minLength: 1
        description: Stable uuid of a saved deterministic; portable across server instances.
      combine_options:
        $ref: "#/$defs/combineOptions"

  userNameInclude:
    type: object
    additionalProperties: false
    required: [user_id, name]
    properties:
      user_id:
        type: integer
        minimum: 1
        description: Owner user id; pair with `name` to reference a saved deterministic.
      name:
        type: string
        minLength: 1
        description: Deterministic name (unique per user); pair with `user_id`.
      combine_options:
        $ref: "#/$defs/combineOptions"

  combineOptions:
    type: object
    additionalProperties: false
    description: >
      Per-side transforms applied before merging. `source` transforms the
      included view config; `destination` transforms this config (e.g. add a
      field referencing an included view).
    properties:
      source:
        $ref: "#/$defs/sideOptions"
      destination:
        $ref: "#/$defs/sideOptions"

  sideOptions:
    type: object
    additionalProperties: false
    properties:
      remove_types:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/identifier"
      remove_fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/viewFieldRef"
      modify_types:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/modifyTypeOp"
      modify_fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/modifyFieldOp"
      add_fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/addFieldOp"

  identifier:
    type: string
    minLength: 1
    pattern: "^[a-z_][a-z0-9_]*$"

  viewFieldRef:
    type: string
    pattern: "^[a-z_][a-z0-9_]*\\.[A-Za-z_][A-Za-z0-9_]*$"
    description: A view field in the form `<view>.<field>`.

  modifyTypeOp:
    type: object
    additionalProperties: false
    required: [type, new_type]
    properties:
      type:
        $ref: "#/$defs/identifier"
      new_type:
        $ref: "#/$defs/identifier"

  modifyFieldOp:
    type: object
    additionalProperties: false
    required: [field]
    anyOf:
      - required: [new_field]
      - required: [def]
    properties:
      field:
        $ref: "#/$defs/viewFieldRef"
      new_field:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      def:
        $ref: "#/$defs/fieldDef"

  addFieldOp:
    type: object
    additionalProperties: false
    required: [type, add_field]
    properties:
      type:
        $ref: "#/$defs/identifier"
      add_field:
        $ref: "#/$defs/fieldEntry"

  viewEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties:
      $ref: "#/$defs/viewDef"

  viewDef:
    oneOf:
      - $ref: "#/$defs/unionView"
      - $ref: "#/$defs/shapedView"

  unionView:
    type: object
    additionalProperties: false
    required: [one_of]
    properties:
      one_of:
        type: array
        minItems: 2
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z_][a-z0-9_]*$"

  shapedView:
    type: object
    additionalProperties: false
    required: [fields]
    properties:
      inherits:
        type: string
        pattern: "^datasource_types\\.[a-z_][a-z0-9_]*$"
      omit:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^[a-z_][a-z0-9_]*$"
        description: >
          Property names inherited from the referenced datasource type that
          should be dropped from the resulting view shape.
      fields:
        type: array
        minItems: 0
        items:
          $ref: "#/$defs/fieldEntry"

  fieldEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
    additionalProperties:
      $ref: "#/$defs/fieldDef"

  fieldDef:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        type: string
        anyOf:
          - enum:
              [
                string,
                number,
                integer,
                unsignedinteger,
                biginteger,
                unsignedbiginteger,
                smallinteger,
                unsignedsmallinteger,
                float,
                boolean,
                datetime,
                binary,
                uuid,
              ]
          - enum:
              [
                "string[]",
                "number[]",
                "integer[]",
                "unsignedinteger[]",
                "biginteger[]",
                "unsignedbiginteger[]",
                "smallinteger[]",
                "unsignedsmallinteger[]",
                "float[]",
                "boolean[]",
                "datetime[]",
                "binary[]",
                "uuid[]",
              ]
          - pattern: "^datasource_types\\.[a-z_][a-z0-9_]*(\\[\\])?$"
          - pattern: "^[a-z_][a-z0-9_]*(\\[\\])?$"
      size:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            const: unlimited
      min_size:
        type: integer
        minimum: 0
        description: Minimum length (string) or value (number). Emitted as `.min(N)` in zod validators.
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        anyOf:
          - type: string
          - type: number
          - type: boolean
      references:
        type: string
        pattern: "^(datasource_types|view_types)\\.[a-z_][a-z0-9_]*\\.[a-z_][a-z0-9_]*$"
        description: >
          Clarifies the join-table FK for array-of-type fields. Either
          `datasource_types.<type>.<field>` (FK into a datasource table) or
          `view_types.<type>.<field>` (FK into a view type defined in this file).
