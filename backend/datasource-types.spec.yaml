version: CURRENT
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/backend/datasource-types.spec.yaml
title: datasource_types.yaml
description: >
  Strict schema for deterministic/datasource_types.yaml. Defines the
  physical data model: one entry per table, with fields, indexes, and
  optional datasource_type flags (readonly-lookup / many-to-many) that drive
  migration generation and CRUD-service scaffolding. Seed rows live in
  datasource_seeds.yaml, not here. The `types:` key is required (must exist)
  but may be an empty array — a no-data-model app (no entities, no
  migrations) declares `types: []` and the migration emitter short-circuits
  accordingly.

type: object
additionalProperties: false
required: [version, types]

properties:
  version:
    description: >
      Contract version this document targets. CURRENT binds to the live
      root specs and may change without notice. A published semver
      (e.g. 1.0.0) binds to the frozen snapshot under versions/<semver>/.
    oneOf:
      - const: CURRENT
      - type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  types:
    type: array
    minItems: 0
    items:
      $ref: "#/$defs/tableEntry"
  datasource_mappings:
    type: array
    minItems: 1
    description: >
      Optional, sparse map from a deterministic type/field to its underlying
      source-system table/column. List only types/fields that differ from the
      deterministic name or that need a non-default type_converter.
    items:
      $ref: "#/$defs/datasourceMappingEntry"
  includes:
    type: array
    minItems: 1
    description: >
      Optional. Pull in other datasource_types configs (by file path or
      deterministic id) and merge them into this one. Each include is folded in
      via the combine module as the `source` (its types prepended); this config
      is the `destination`. The block is resolved and stripped before emit, so a
      config may declare `types: []` and rely entirely on its includes.
    items:
      $ref: "#/$defs/includeEntry"

$defs:
  identifier:
    type: string
    minLength: 1
    pattern: "^[a-z_][a-z0-9_]*$"

  tableColumnRef:
    type: string
    pattern: "^[a-z_][a-z0-9_]*\\.[a-z_][a-z0-9_]*$"
    description: Foreign-key target in the form `<table>.<column>`.

  sizeValue:
    oneOf:
      - type: integer
        minimum: 0
      - type: string
        const: unlimited

  includeEntry:
    type: object
    additionalProperties: false
    oneOf:
      - required: [file]
      - required: [id]
      - required: [uuid]
      - required: [user_id, name]
    properties:
      file:
        type: string
        minLength: 1
        description: Path to another datasource_types.yaml, relative to this file's dir.
      id:
        description: Deterministic id (number) or name (string) of a saved backend.
        anyOf:
          - type: string
            minLength: 1
          - type: integer
            minimum: 1
      uuid:
        type: string
        minLength: 1
        description: Stable uuid of a saved deterministic; portable across server instances.
      user_id:
        type: integer
        minimum: 1
        description: Owner user id; pair with `name` to reference a saved deterministic.
      name:
        type: string
        minLength: 1
        description: Deterministic name (unique per user); pair with `user_id`.
      combine_options:
        $ref: "#/$defs/combineOptions"

  combineOptions:
    type: object
    additionalProperties: false
    description: >
      Per-side transforms applied before merging. `source` transforms the
      included config; `destination` transforms this config (e.g. add a FK
      referencing an included type).
    properties:
      source:
        $ref: "#/$defs/sideOptions"
      destination:
        $ref: "#/$defs/sideOptions"

  sideOptions:
    type: object
    additionalProperties: false
    properties:
      remove_types:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/identifier"
      remove_fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/tableColumnRef"
      modify_types:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/modifyTypeOp"
      modify_fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/modifyFieldOp"
      add_fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/addFieldOp"

  modifyTypeOp:
    type: object
    additionalProperties: false
    required: [type, new_type]
    properties:
      type:
        $ref: "#/$defs/identifier"
      new_type:
        $ref: "#/$defs/identifier"

  modifyFieldOp:
    type: object
    additionalProperties: false
    required: [field]
    anyOf:
      - required: [new_field]
      - required: [def]
    properties:
      field:
        $ref: "#/$defs/tableColumnRef"
      new_field:
        $ref: "#/$defs/identifier"
      def:
        $ref: "#/$defs/fieldDef"

  addFieldOp:
    type: object
    additionalProperties: false
    required: [type, add_field]
    properties:
      type:
        $ref: "#/$defs/identifier"
      add_field:
        $ref: "#/$defs/fieldEntry"

  tableEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      $ref: "#/$defs/identifier"
    additionalProperties:
      $ref: "#/$defs/tableDef"

  tableDef:
    type: object
    additionalProperties: false
    required: [fields]
    properties:
      datasource_type:
        type: string
        enum: [readonly-lookup, many-to-many]
      skip_migrations:
        type: boolean
      use_optimistic_concurrency:
        type: boolean
        description: >
          Optional per-type override of the datasource-wide
          use_optimistic_concurrency setting. Set false to opt a type out of
          OCC (e.g. a legacy table with no `updated` version column); omit to
          inherit the datasource default.
      target:
        type: string
        enum: [StandardCrud, Crud, None]
        default: StandardCrud
        description: >
          CRUD code-generation tier. StandardCrud = implicit id + audit columns;
          Crud = uses the declared `primary_key: true` field; None = emit no
          routes/services for this type.
      fields:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/fieldEntry"
      indexes:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/indexEntry"

  fieldEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties:
      $ref: "#/$defs/fieldDef"

  fieldDef:
    oneOf:
      - $ref: "#/$defs/stringField"
      - $ref: "#/$defs/characterField"
      - $ref: "#/$defs/numberField"
      - $ref: "#/$defs/integerField"
      - $ref: "#/$defs/unsignedIntegerField"
      - $ref: "#/$defs/bigIntegerField"
      - $ref: "#/$defs/unsignedBigIntegerField"
      - $ref: "#/$defs/smallIntegerField"
      - $ref: "#/$defs/unsignedSmallIntegerField"
      - $ref: "#/$defs/floatField"
      - $ref: "#/$defs/decimalField"
      - $ref: "#/$defs/booleanField"
      - $ref: "#/$defs/binaryField"
      - $ref: "#/$defs/datetimeField"
      - $ref: "#/$defs/uuidField"
      - $ref: "#/$defs/referenceField"
    description: >
      Foreign keys are declared inline on numeric fields via the optional
      `references: <table>.<column>` property — see numberField, integerField,
      unsignedIntegerField, bigIntegerField, unsignedBigIntegerField,
      smallIntegerField, unsignedSmallIntegerField, floatField. A foreign key
      may also omit `type` entirely (referenceField); the column then inherits
      the referenced parent primary key's type. The standalone
      `{type: reference, references: ...}` form has been removed.

  referenceField:
    type: object
    additionalProperties: false
    required: [references]
    description: >
      A foreign key that omits its own `type` and inherits the referenced
      parent primary key's type (uuid → uuid, string → string, integer →
      integer). Equivalent to authoring the parent's id type explicitly with a
      `references:`, without repeating it.
    properties:
      references:
        $ref: "#/$defs/tableColumnRef"
      primary_key: { type: boolean }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }

  stringField:
    type: object
    additionalProperties: false
    required: [type]
    description: >
      An `is_unique: true` string must declare a bounded integer `size` (a max
      length): `size: unlimited` (or no size) maps to TEXT/CLOB, which MySQL and
      SQL Server refuse to put under a UNIQUE index without a key-prefix length.
      Enforced in the semantic layer (datasource-types-semantics.mjs).
    properties:
      type: { const: string }
      primary_key: { type: boolean }
      size: { $ref: "#/$defs/sizeValue" }
      min_size:
        type: integer
        minimum: 0
        description: Minimum length for the string. Emitted as `.min(N)` in zod validators.
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string
      references:
        $ref: "#/$defs/tableColumnRef"
      validation:
        type: array
        minItems: 1
        items:
          anyOf:
            - type: string
            - type: number
        description: Free-form validation directives (rarely used; keep loose).

  numberField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: number }
      primary_key: { type: boolean }
      size:
        type: integer
        minimum: 0
      min_size:
        type: integer
        description: Minimum value for the number. Emitted as `.min(N)` in zod validators.
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: number
      references:
        $ref: "#/$defs/tableColumnRef"

  integerField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: integer }
      primary_key: { type: boolean }
      size:
        type: integer
        minimum: 0
      min_size:
        type: integer
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: integer
      references:
        $ref: "#/$defs/tableColumnRef"

  unsignedIntegerField:
    type: object
    additionalProperties: false
    required: [type]
    description: >
      Unsigned 32-bit integer. Maps to UNSIGNED INT (MySQL) or a non-negative
      integer column elsewhere. `default_value` and `min_size` must be >= 0.
    properties:
      type: { const: unsignedinteger }
      primary_key: { type: boolean }
      size:
        type: integer
        minimum: 0
      min_size:
        type: integer
        minimum: 0
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: integer
        minimum: 0
      references:
        $ref: "#/$defs/tableColumnRef"

  bigIntegerField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: biginteger }
      primary_key: { type: boolean }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string
      references:
        $ref: "#/$defs/tableColumnRef"

  unsignedBigIntegerField:
    type: object
    additionalProperties: false
    required: [type]
    description: >
      Unsigned 64-bit integer. Maps to UNSIGNED BIGINT (MySQL) or a
      non-negative 64-bit integer column elsewhere. `default_value` is a
      string so values above Number.MAX_SAFE_INTEGER stay exact.
    properties:
      type: { const: unsignedbiginteger }
      primary_key: { type: boolean }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string
      references:
        $ref: "#/$defs/tableColumnRef"

  smallIntegerField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: smallinteger }
      primary_key: { type: boolean }
      size:
        type: integer
        minimum: 0
      min_size:
        type: integer
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: integer
      references:
        $ref: "#/$defs/tableColumnRef"

  unsignedSmallIntegerField:
    type: object
    additionalProperties: false
    required: [type]
    description: >
      Unsigned 16-bit integer. Maps to UNSIGNED SMALLINT (MySQL) or a
      non-negative small integer column elsewhere. `default_value` and
      `min_size` must be >= 0.
    properties:
      type: { const: unsignedsmallinteger }
      primary_key: { type: boolean }
      size:
        type: integer
        minimum: 0
      min_size:
        type: integer
        minimum: 0
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: integer
        minimum: 0
      references:
        $ref: "#/$defs/tableColumnRef"

  floatField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: float }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: number
      references:
        $ref: "#/$defs/tableColumnRef"

  characterField:
    type: object
    additionalProperties: false
    required: [type]
    description: Fixed-length character column (CHAR(n)); defaults to a single character when `size` is omitted.
    properties:
      type: { const: character }
      size:
        type: integer
        minimum: 1
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string

  decimalField:
    type: object
    additionalProperties: false
    required: [type]
    description: Fixed-point exact numeric. `size` is an optional `[precision, scale]` pair; sqlserver/oracle require it. Carried as a string in generated code to preserve exactness.
    properties:
      type: { const: decimal }
      size:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: integer
          minimum: 0
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        anyOf:
          - type: string
          - type: number

  uuidField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: uuid }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string
      references:
        $ref: "#/$defs/tableColumnRef"

  booleanField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: boolean }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: boolean

  binaryField:
    type: object
    additionalProperties: false
    required: [type, size]
    properties:
      type: { const: binary }
      size:
        anyOf:
          - type: integer
            minimum: 1
          - type: string
            const: unlimited
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string

  datetimeField:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: datetime }
      is_nullable: { type: boolean }
      is_unique: { type: boolean }
      default_value:
        type: string

  indexEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      pattern: "^[a-z_][a-z0-9_]*$"
    additionalProperties:
      type: object
      additionalProperties: false
      required: [fields, is_unique]
      properties:
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/$defs/identifier"
        is_unique: { type: boolean }

  datasourceMappingEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties:
      $ref: "#/$defs/datasourceMappingDef"

  datasourceMappingDef:
    type: object
    additionalProperties: false
    anyOf:
      - required: [source]
      - required: [field_mappings]
    properties:
      source:
        type: string
        minLength: 1
        description: Underlying source-system table name when it differs from the deterministic type name.
      field_mappings:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/fieldMappingEntry"

  fieldMappingEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    additionalProperties:
      $ref: "#/$defs/fieldMappingDef"

  fieldMappingDef:
    type: object
    additionalProperties: false
    anyOf:
      - required: [source]
      - required: [type_converter]
    properties:
      source:
        type: string
        minLength: 1
        description: Underlying source-system column name when it differs from the deterministic field name.
      type_converter:
        type: string
        minLength: 1
        description: >
          Name of a converter function applied when reading from / writing to
          the underlying source. Omit to use the default conversion for the
          field's declared type.
