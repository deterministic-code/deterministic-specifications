version: CURRENT
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/backend/datasource-seeds.spec.yaml
title: datasource_seeds.yaml
description: >
  Strict schema for deterministic/datasource_seeds.yaml. Seed rows for
  datasource_types tables, keyed by table name. The `seeds:` key is required
  (must exist) but may be an empty array — an app with no seed data declares
  `seeds: []`.

  Shape is only the first gate. DatasourceSeedsValidator then checks each row
  against the companion datasource_types.yaml: table names must exist, every
  key must be a declared field, values must match the field type, and a field
  may be omitted when it is `is_nullable: true` or declares a `default_value`.
  `null` is only valid for nullable fields. Auto-injected columns (`id`,
  `created`, `updated`) are not authored here — the row key (`id1`, `id2`, …)
  supplies `id`.

type: object
additionalProperties: false
required: [version, seeds]

properties:
  version:
    description: >
      Contract version this document targets. CURRENT binds to the live
      root specs and may change without notice. A published semver
      (e.g. 1.0.0) binds to the frozen snapshot under versions/<semver>/.
    oneOf:
      - const: CURRENT
      - type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  seeds:
    type: array
    minItems: 0
    items:
      $ref: "#/$defs/tableSeedsEntry"

$defs:
  identifier:
    type: string
    minLength: 1
    pattern: "^[a-z_][a-z0-9_]*$"

  tableSeedsEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      $ref: "#/$defs/identifier"
    additionalProperties:
      type: array
      minItems: 1
      items:
        $ref: "#/$defs/seedEntry"

  seedEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      pattern: "^id[0-9]+$"
    additionalProperties:
      type: object
      minProperties: 0
      additionalProperties:
        anyOf:
          - type: string
          - type: number
          - type: boolean
          - type: "null"
