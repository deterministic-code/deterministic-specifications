version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/backend/datasource-seeds.spec.yaml
title: datasource_seeds.yaml
description: >
  Strict schema for deterministic/datasource_seeds.yaml — the only place
  seed rows are authored. Seed rows for tables selected by datasource.yaml,
  keyed by type name. Field types come from types.yaml. The `seeds:` key is
  required (must exist) but may be an empty array — an app with no seed data
  declares `seeds: []`. A row body may be empty (`id1: {}`) when every field
  is `is_nullable: true` or declares a `default_value`.

  Optional `includes:` pull in other seed documents (`file:`, `id:`, `uuid:`,
  or `user_id` + `name`). Each included document's seeds are prepended and
  this document's seeds come last. `combine_options` may drop a type's seed
  block by name before the merge. File entries are resolved and stripped
  before the parser sees one document. There is no `types: { filter }`
  directive on seeds.

  Shape is only the first gate. DatasourceSeedsValidator then checks each row
  against the companion types.yaml (field types) and datasource.yaml (which
  types are tables): table names must exist, every key must be a declared
  field, values must match the field type, and a field may be omitted when
  it is `is_nullable: true` or declares a `default_value`. `null` is only
  valid for nullable fields. Audit columns (`created`, `updated`) are not
  authored here. Generated identity (`inherits: set` without
  `is_fixed_id`) is supplied by the row key (`id1`, `id2`, …). Fields
  marked `is_fixed_id: true` on datasource.yaml must appear in each seed
  row with the same stable values every run.

type: object
additionalProperties: false
required: [version, seeds]

properties:
  version:
    description: >
      Contract version this document targets. Must be a semver
      (e.g. 1.0.0). The document is validated against that version's
      specs and engine; there is no floating alias.
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  includes:
    type: array
    minItems: 1
    description: >
      Optional. `file:`/`id:`/`uuid:`/`user_id+name` entries pull in other
      datasource_seeds configs and merge them (each included config's seeds
      prepended, this config's own seeds last). File entries are resolved
      and stripped before emit. Remote entries stay until a resolver loads
      them. There is no `types:` filter directive.
    items:
      $ref: "#/$defs/includeEntry"
  seeds:
    type: array
    minItems: 0
    items:
      $ref: "#/$defs/tableSeedsEntry"

$defs:
  identifier:
    type: string
    minLength: 1
    pattern: "^[a-z_][a-z0-9_]*$"

  includeEntry:
    oneOf:
      - $ref: "#/$defs/fileInclude"
      - $ref: "#/$defs/idInclude"
      - $ref: "#/$defs/uuidInclude"
      - $ref: "#/$defs/userNameInclude"

  fileInclude:
    type: object
    additionalProperties: false
    required: [file]
    properties:
      file:
        type: string
        minLength: 1
        description: Path to another datasource_seeds.yaml, relative to this file's dir.
      combine_options:
        $ref: "#/$defs/combineOptions"

  idInclude:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        description: Deterministic id (number) or name (string) of a saved backend.
        anyOf:
          - type: string
            minLength: 1
          - type: integer
            minimum: 1
      combine_options:
        $ref: "#/$defs/combineOptions"

  uuidInclude:
    type: object
    additionalProperties: false
    required: [uuid]
    properties:
      uuid:
        type: string
        minLength: 1
        description: Stable uuid of a saved deterministic; portable across server instances.
      combine_options:
        $ref: "#/$defs/combineOptions"

  userNameInclude:
    type: object
    additionalProperties: false
    required: [user_id, name]
    properties:
      user_id:
        type: integer
        minimum: 1
        description: Owner user id; pair with `name` to reference a saved deterministic.
      name:
        type: string
        minLength: 1
        description: Deterministic name (unique per user); pair with `user_id`.
      combine_options:
        $ref: "#/$defs/combineOptions"

  combineOptions:
    type: object
    additionalProperties: false
    description: >
      Per-side transforms applied before merging. `source` transforms the
      included seeds config; `destination` transforms this config. The only
      supported op is dropping a type's seed block by name.
    properties:
      source:
        $ref: "#/$defs/sideOptions"
      destination:
        $ref: "#/$defs/sideOptions"

  sideOptions:
    type: object
    additionalProperties: false
    properties:
      remove_types:
        type: array
        minItems: 1
        description: Type names whose seed blocks are dropped from this side before merge.
        items:
          $ref: "#/$defs/identifier"

  tableSeedsEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      $ref: "#/$defs/identifier"
    additionalProperties:
      type: array
      minItems: 1
      items:
        $ref: "#/$defs/seedEntry"

  seedEntry:
    type: object
    minProperties: 1
    maxProperties: 1
    propertyNames:
      pattern: "^id[0-9]+$"
    additionalProperties:
      type: object
      minProperties: 0
      additionalProperties:
        anyOf:
          - type: string
          - type: number
          - type: boolean
          - type: "null"
