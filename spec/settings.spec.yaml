$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/settings.spec.yaml
title: settings.yaml
description: >
  Strict schema for deterministic/settings.yaml — the one settings document for
  a deterministic. Declares project-wide generation settings that govern how the
  backend and frontend generators emit code: the backend block (languages +
  datasources), filename and type identifier casing, comment verbosity,
  miscellaneous toggles, and the frontend block (framework + language +
  validator toggles).

type: object
additionalProperties: false
required: [settings]

properties:
  settings:
    type: object
    additionalProperties: false
    required: [application_tier, backend, comments, other]
    properties:
      application_tier:
        type: string
        enum: [full-stack, backend, frontend, other]
        description: >
          Which application tier this deterministic generates. Required — every
          settings.yaml declares its tier explicitly (there is no default): a
          backend-only app must say `backend` so verify never plans a
          frontend-tier step it can only fail. `backend` emits the flat
          multi-language backend; `frontend` emits the frontend tree;
          `full-stack` emits backend/ + frontend/ + reverse-proxy orchestration
          (the codegen `--tier all` layout); `other` is a classification that
          generates no code. This is the single source of truth for the tier:
          the deterministic record's application_tier_id is derived from it on
          every save. `--tier` overrides it per-run.
      application_name:
        type: string
        minLength: 1
        description: >
          Optional application name for the whole app. When set it supersedes
          backend-app.yaml's `name` as the emitted backend's server start-message
          name (and the package.json name), and is also the frontend app name
          (package.json name, index.html title, App.tsx heading); falls back to
          backend-app.yaml `name`, then `generated-app`, when omitted.
      backend:
        $ref: "#/$defs/backend"
      datasource:
        $ref: "#/$defs/datasourceBlock"
      languages:
        $ref: "#/$defs/languages"
      comments:
        $ref: "#/$defs/comments"
      other:
        $ref: "#/$defs/other"
      frontend:
        $ref: "#/$defs/frontend"

$defs:
  frontend:
    type: object
    additionalProperties: false
    description: >
      Frontend generation settings, under `settings.frontend`. The frontend app
      name comes from the shared `application_name`.
    properties:
      framework:
        type: string
        enum: [React]
        description: UI framework to scaffold. Only React is supported today.
      language:
        $ref: "#/$defs/frontendLanguage"
      generate_validators:
        type: boolean
        description: >
          When true, the `frontend_validators` step emits a zod schema per
          OpenAPI component beside each object's client bindings
          (frontend/src/bindings/<datasource>/<object>/validators.ts) AND
          `client_bindings` wraps each request/response body with the matching
          schema's `.parse()`. On by default; set to false to opt out.

  language:
    type: string
    enum: [typescript, javascript, csharp, java, python, rust]

  frontendLanguage:
    type: string
    enum: [typescript]
    default: typescript
    description: >
      The frontend's implementation language, declared independently of
      settings.backend.languages (which is backend-only). Today only
      `typescript` (with framework React) is supported; extend this enum
      only when a matching frontend framework/language pair ships.

  datasource:
    type: string
    enum: [sqlite, mysql, postgres, sqlserver, oracle]

  casingStyle:
    type: string
    enum: [pascal, camel, snake, kebab, auto]

  backend:
    type: object
    additionalProperties: false
    required: [languages]
    description: >
      Backend generation targets, under `settings.backend`. `languages` is the
      set of BACKEND languages to emit — it is backend-only and never lists the
      frontend's language, which is declared separately under
      settings.frontend.language. `languages` is always required. `datasources`
      is optional and is only declared when migration codegen will run; a no-SQL
      backend (only `create-backend-app`, no `create-migrate-scripts`) may omit
      it.
    properties:
      languages:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/language"
      datasources:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/datasource"

  casing:
    type: object
    additionalProperties: false
    description: >
      Per-language identifier/path casing. Every key is optional and defaults
      to `auto`, which resolves to the language's natural convention (e.g.
      TypeScript kebab files + Pascal types, Rust snake, C# Pascal).
    properties:
      file_names:
        $ref: "#/$defs/casingStyle"
      types:
        $ref: "#/$defs/casingStyle"
      fields:
        $ref: "#/$defs/casingStyle"
      directories:
        $ref: "#/$defs/casingStyle"

  languages:
    type: object
    additionalProperties: false
    description: >
      Per-language generation settings keyed by language name. Each entry is
      optional; an omitted language (or leaf) inherits default-settings.yaml.
      `library_reference_mode` — how the emitted app references the
      deterministic runtime (npm imports the package; bundled copies the
      library into the app; registry is Rust-only, a Cargo.toml entry pointing
      at deterministic-code.com). `package_manager` applies to TypeScript only.
    properties:
      typescript:
        type: object
        additionalProperties: false
        properties:
          casing:
            $ref: "#/$defs/casing"
          library_reference_mode:
            type: string
            enum: [npm, bundled]
          package_manager:
            type: string
            enum: [auto, npm, yarn, pnpm]
      rust:
        type: object
        additionalProperties: false
        properties:
          casing:
            $ref: "#/$defs/casing"
          library_reference_mode:
            type: string
            enum: [registry, bundled]
      csharp:
        type: object
        additionalProperties: false
        properties:
          casing:
            $ref: "#/$defs/casing"
          library_reference_mode:
            type: string
            enum: [bundled]

  comments:
    type: string
    enum: [none, simple, descriptive]
    default: simple
    description: >
      Comment verbosity for emitted code, consumed as `settings.comments`.
      `none` suppresses generated comments; `simple` (default) emits terse doc
      comments; `descriptive` emits fuller prose.

  other:
    type: object
    additionalProperties: false
    required: [organize_by_feature]
    properties:
      organize_by_feature:
        type: boolean
      reverse_proxy:
        type: string
        enum: [none, nginx, caddy, traefik]
        description: >
          Full-Stack-tier only: the webserver fronting the combined backend +
          frontend under `tier=all`. `none` emits no proxy; nginx/caddy/traefik
          each emit a file-configured proxy service. Ignored for single-tier
          generation.
      proxy_backend:
        type: string
        enum: [typescript, rust, csharp]
        description: >
          Full-Stack-tier only: which declared backend language the reverse
          proxy routes `/api` to when more than one backend is generated.
          Defaults to the first declared backend language.
      generate_file_hash_list:
        type: boolean
        default: true
        description: >
          When true, codegen writes a deterministic-hashes.yaml at the output
          root mapping each emitted file's relative path to the sha256 of its
          body. The emitted files themselves carry no in-file hash header.
      error_on_hash_overwrite:
        type: boolean
        default: true
        description: >
          When true, refuse to overwrite a previously-generated file whose
          on-disk content no longer matches its entry in the hash manifest.
          Set false to bypass the tamper check (e.g. for hand-edited
          experiments).

  datasourceBlock:
    type: object
    additionalProperties: false
    properties:
      id_type:
        type: string
        enum: [integer, biginteger, uuid, string]
      uuid:
        type: string
        enum: [native, string]
      datetime:
        type: string
        enum: [native, string]
      pluralize_datatable_names:
        type: boolean
        default: true
        description: >
          When true, emit plural table names in SQL/migrations (e.g.
          backends, backend_types) and resolve repositories to those plural
          names at runtime. Singular YAML entity keys remain the canonical
          identifier in code. Last token only is pluralized for compound
          names. Default true.
      use_stored_procedures:
        type: boolean
        default: false
        description: >
          When true, CRUD is emitted as stored-procedure calls (the
          `stored-procedures` step emits per-dialect procedure definitions and
          repositories invoke them) instead of inline SQL. Default false.
      use_optimistic_concurrency:
        type: boolean
        default: false
        description: >
          When true, mutating operations require the row's current `updated`
          token and the OpenAPI mutating request bodies carry it, so a stale
          write is rejected. Default false.
