expect:
  covers: pattern:#/$defs/viewFieldRef
---
version: 1.0.0
types: []
includes:
  - file: x.yaml
    combine_options:
      source:
        remove_types:
          - old
        remove_fields:
          - NOT VALID
        modify_types:
          - type: old
            new_type: person
        modify_fields:
          - field: old.name
            new_field: display
        add_fields:
          - type: old
            add_field:
              extra:
                type: string
