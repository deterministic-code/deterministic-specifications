expect:
  covers: type:#/$defs/modifyTypeOp
---
version: 1.0.0
types: []
includes:
  - file: x.yaml
    combine_options:
      source:
        remove_types:
          - old
        remove_fields:
          - old.Name
        modify_types:
          - []
        modify_fields:
          - field: old.Name
            new_field: Display
        add_fields:
          - type: old
            add_field:
              Extra:
                type: string
