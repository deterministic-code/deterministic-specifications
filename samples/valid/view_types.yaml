version: 1.0.0
includes:
  - datasource_types:
      include: "*"
      filter: type != "link"
      auto_enrich: true
  - file: shared/views.yaml
    combine_options:
      source:
        remove_types: [old_view]
        remove_fields: [old_view.old_field]
        modify_types:
          - type: old_view
            new_type: person
        modify_fields:
          - field: old_view.old_field
            new_field: display_name
          - field: old_view.flag
            def:
              type: boolean
              is_nullable: true
        add_fields:
          - type: old_view
            add_field:
              extra:
                type: string
                size: 32
      destination:
        remove_types: [scratch_view]
        remove_fields: [scratch_view.tmp]
        modify_types:
          - type: scratch_view
            new_type: summary
        modify_fields:
          - field: scratch_view.tmp
            new_field: body
          - field: scratch_view.n
            def:
              type: integer
              min_size: 0
        add_fields:
          - type: scratch_view
            add_field:
              tag:
                type: string
  - id: saved_views
    combine_options:
      source:
        remove_types: [extra_view]
  - id: 3
    combine_options:
      destination:
        remove_types: [scratch_view]
  - uuid: 22222222-2222-2222-2222-222222222222
    combine_options:
      source:
        remove_fields: [person.bio]
  - user_id: 2
    name: demo_views
    combine_options:
      destination:
        remove_fields: [person.score]
types:
  - person:
      inherits: datasource_types.user
      omit: [bio, payload]
      fields:
        - display_name:
            type: string
            size: 128
            min_size: 0
            is_nullable: false
            is_unique: true
            default_value: ""
        - score:
            type: number
            size: unlimited
            default_value: 0
        - count:
            type: integer
            default_value: 0
        - visits:
            type: unsignedinteger
        - big_count:
            type: biginteger
        - huge_count:
            type: unsignedbiginteger
        - small_count:
            type: smallinteger
        - tiny_count:
            type: unsignedsmallinteger
        - ratio:
            type: float
        - active:
            type: boolean
            default_value: true
        - created_on:
            type: datetime
        - avatar:
            type: binary
        - uid:
            type: uuid
        - labels:
            type: "string[]"
        - scores:
            type: "number[]"
        - counts:
            type: "integer[]"
        - visit_list:
            type: "unsignedinteger[]"
        - big_list:
            type: "biginteger[]"
        - huge_list:
            type: "unsignedbiginteger[]"
        - small_list:
            type: "smallinteger[]"
        - tiny_list:
            type: "unsignedsmallinteger[]"
        - ratio_list:
            type: "float[]"
        - flags:
            type: "boolean[]"
        - dates:
            type: "datetime[]"
        - blobs:
            type: "binary[]"
        - ids:
            type: "uuid[]"
        - role:
            type: datasource_types.role
            references: datasource_types.role.id
        - roles:
            type: datasource_types.role[]
            references: datasource_types.user.role_id
        - manager:
            type: person
        - reports:
            type: person[]
            references: view_types.person.parent_id
  - empty_shape:
      fields: []
  - result:
      one_of: [person, empty_shape]
