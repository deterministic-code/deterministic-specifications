version: 1.0.0
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://cali-services.local/schemas/deterministic/versions/1.0.0/backend/services.spec.yaml
title: services.yaml
description: >
  Strict schema for deterministic/services.yaml. Each entry declares one
  service class resolved via DI at app bootstrap (see src/services/createServices.ts).

type: object
additionalProperties: false
required: [version, services]

# `services:` is required (key must exist) but may be an empty array. The two
# default tail handlers (NotFoundMiddlewareService, ErrorHandlerMiddlewareService)
# are built-in registry entries auto-mounted by parseAppConfig + createBackendApp; a
# minimal-CRUD-only sample need not declare any service entries at all.

properties:
  version:
    description: >
      Contract version this document targets. Must be a semver
      (e.g. 1.0.0). The document is validated against that version's
      specs and engine; there is no floating alias.
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  includes:
    type: array
    minItems: 1
    description: >
      Optional. Composes this services config. A `types:` directive entry
      auto-generates CRUD service entries for the types.yaml candidates its
      `filter` selects. `file:`/`id:` entries pull in other services configs
      and merge them via the combine module (each included config's services
      prepended, this config's own services last). An `id:` entry also folds
      the referenced deterministic's datasource so the included services'
      `repo` args resolve. The `file:`/`id:` entries are resolved and stripped
      before emit; the `types:` directive is consumed at services-expansion
      time.
    items:
      $ref: "#/$defs/includeEntry"

  services:
    type: array
    items:
      $ref: "#/$defs/serviceEntry"

$defs:
  includeEntry:
    oneOf:
      - $ref: "#/$defs/typesDirectiveInclude"
      - $ref: "#/$defs/fileInclude"
      - $ref: "#/$defs/idInclude"
      - $ref: "#/$defs/uuidInclude"
      - $ref: "#/$defs/userNameInclude"

  typesDirectiveInclude:
    type: object
    additionalProperties: false
    required: [types]
    properties:
      types:
        type: object
        additionalProperties: false
        properties:
          filter:
            $ref: "#/$defs/filterExpr"

  filterExpr:
    type: string
    minLength: 1
    description: >
      Inclusion predicate. The candidate is KEPT when TRUE. Candidates
      are drawn from types.yaml; `tag` selects kind. types, datasource,
      routes, and services share this grammar:

        expr     ::= or
        or       ::= and ( "||" and )*
        and      ::= atom ( "&&" atom )*
        atom     ::= "(" expr ")" | compare
        compare  ::= accessor ("==" | "!=") value
        accessor ::= "type" | "tag" | "inherits"
        value    ::= quoted-string

      `type` is the candidate name (`type == "person"`). `tag` is true when
      the candidate's `tags` array contains that string
      (`tag == "datasource_type"`). `inherits` is the parent type name
      (`inherits == "set"`). String literals must be double-quoted. Any
      other identifier is a parse error.

  fileInclude:
    type: object
    additionalProperties: false
    required: [file]
    properties:
      file:
        type: string
        minLength: 1
        description: Path to another services.yaml, relative to this file's dir.
      combine_options:
        $ref: "#/$defs/combineOptions"

  idInclude:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        description: Deterministic id (number) or name (string) of a saved backend.
        anyOf:
          - type: string
            minLength: 1
          - type: integer
            minimum: 1
      combine_options:
        $ref: "#/$defs/combineOptions"

  uuidInclude:
    type: object
    additionalProperties: false
    required: [uuid]
    properties:
      uuid:
        type: string
        minLength: 1
        description: Stable uuid of a saved deterministic; portable across server instances.
      combine_options:
        $ref: "#/$defs/combineOptions"

  userNameInclude:
    type: object
    additionalProperties: false
    required: [user_id, name]
    properties:
      user_id:
        type: integer
        minimum: 1
        description: Owner user id; pair with `name` to reference a saved deterministic.
      name:
        type: string
        minLength: 1
        description: Deterministic name (unique per user); pair with `user_id`.
      combine_options:
        $ref: "#/$defs/combineOptions"

  combineOptions:
    type: object
    additionalProperties: false
    description: >
      Per-side transforms applied before merging. `source` transforms the
      included services config; `destination` transforms this config. Services
      are flat entries with no editable fields, so the only supported op is
      dropping a whole service by name.
    properties:
      source:
        $ref: "#/$defs/sideOptions"
      destination:
        $ref: "#/$defs/sideOptions"

  sideOptions:
    type: object
    additionalProperties: false
    properties:
      remove_services:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/serviceName"

  serviceName:
    type: string
    minLength: 1
    pattern: "^[A-Z][A-Za-z0-9]*$"
    description: PascalCase service class name to drop from the side before merge.

  serviceEntry:
    type: object
    additionalProperties: false
    required: [name, description]
    properties:
      name:
        type: string
        minLength: 1
        pattern: "^[A-Z][A-Za-z0-9]*$"
        description: PascalCase service class name.
      module:
        type: string
        minLength: 1
        description: >
          OPTIONAL dynamic-import specifier the runtime hands to `import()` to
          resolve the service class at app bootstrap. When omitted, the
          codegen derives a convention path from the class name (under
          organize=by-feature: `./features/<deriveCustomEntity(name)>/custom/<file-base>`).
          Two shapes are accepted when set:
            - bare specifier (e.g. `deterministic/middleware`) — resolved
              via the consumer's `node_modules`.
            - relative path (e.g. `./services/foo-service`) — resolved against the
              app's `srcRoot` and tried with `.js`, `.mjs`, `.ts` extensions.
          The legacy `type:` field (introduced before dynamic module loading) is
          rejected; consumers must migrate to `module:`.
      description:
        type: string
        minLength: 1
        description: Prose contract for the service. Consumed by OpenAPI docs and cross-language codegen.
      args:
        type: array
        description: >
          Optional constructor args resolved by the DI container, in positional
          order. Each item is one of `repo`, `service`, `config`, `undefined`,
          or `literal`; see the loader in app/loaders/parseServiceSpecs.ts.
        items:
          $ref: "#/$defs/argSpec"

  argSpec:
    oneOf:
      - type: object
        additionalProperties: false
        required: [kind, name]
        properties:
          kind:
            const: repo
          name:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required: [kind, name]
        properties:
          kind:
            const: service
          name:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required: [kind, key]
        properties:
          kind:
            const: config
          key:
            type: string
            minLength: 1
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            const: undefined
      - type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind:
            const: literal
          value: {}
